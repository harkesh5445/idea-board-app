version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: idea_user
      POSTGRES_PASSWORD: idea_pass
      POSTGRES_DB: idea_board
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgres://idea_user:idea_pass@db:5432/idea_board
    ports:
      - '4000:4000'
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  db_data:
